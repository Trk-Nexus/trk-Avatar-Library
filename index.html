<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>trk! — Terminal &amp; Wizard Skin (trk269)</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body trk-build="trk269" data-theme="dark">

<header>
  <h1>trk! Terminal &amp; Wizard Skin</h1>
  <p>trk-build: <span id="trk-build"></span> | CACHE: <span id="cache-name"></span></p>

  <!-- テーマ切替コントロール -->
  <div class="theme-controls">
    <label class="theme-label" for="theme-select">テーマ:</label>
    <select id="theme-select" class="custom-select">
      <option value="dark">ダーク</option>
      <option value="light">ライト</option>
      <option value="system">システム設定に従う</option>
    </select>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
      🌓
    </button>
  </div>
</header>

<main>
  <!-- スクリーンリーダー用ライブリージョン -->
  <div id="status-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <section class="cli-base">
    <div class="cli-term" id="cli-term" role="log" aria-label="ターミナル出力"></div>
    <input type="text" class="cli-input" id="cli-input" placeholder="コマンドを入力 (man / help でヘルプ)" aria-label="コマンド入力">
  </section>

  <!-- スキン選択ポップオーバー（アンカーポジショニング対象） -->
  <div class="skin-picker-anchor" id="skin-picker-anchor">
    <button type="button" id="skin-picker-toggle" class="skin-picker-toggle" aria-expanded="false" aria-haspopup="true" aria-controls="skin-picker-popover">
      スキン選択: <span id="skin-picker-label">wizard-cli</span>
    </button>
    <div id="skin-picker-popover" class="skin-picker-popover" role="menu" aria-label="スキン一覧" hidden>
      <div class="skin-picker-header">
        <span class="skin-picker-count" id="skin-picker-count">24 種</span>
        <input type="search" id="skin-picker-search" class="skin-picker-search" placeholder="スキン名で検索" aria-label="スキン検索">
      </div>
      <ul class="skin-picker-list" id="skin-picker-list"></ul>
    </div>
  </div>

  <!-- スキンプレビューカード（モダンUI） -->
  <section class="skin-preview" aria-label="スキンプレビュー">
    <h2 class="sr-only">スキンプレビュー</h2>
    <div class="skin-preview-grid" id="skin-preview-grid"></div>
  </section>
</main>

<!-- js/characters/miku.js の直後に skins-wizard.js を読み込む -->
<script type="module" src="js/core.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module" src="js/cli.js"></script>
<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/skins-wizard.js"></script>
<script type="module">
  import { SKIN_CATS, CLI_FEATURE_DEFAULTS } from "./js/core.js";
  import { sanitizeCliLook, cliLookVars, CLI_CURSOR_SHAPE } from "./js/data.js";
  import { CliCommands } from "./js/cli.js";
  import { SKINS_WIZARD } from "./js/skins-wizard.js";

  document.getElementById("trk-build").textContent = document.documentElement.getAttribute("trk-build") || "trk269";
  document.getElementById("cache-name").textContent = "trk-v2026.11.03-trk269";

  // Wizard スキンのカテゴリ登録
  console.log("SKIN_CATS.wizard:", SKIN_CATS.wizard);
  console.log("Wizard スキン数:", SKINS_WIZARD.length);

  // --- テーマ状態管理 ---
  const root = document.documentElement;
  const themeSelect = document.getElementById("theme-select");
  const themeToggle = document.getElementById("theme-toggle");
  const skinPickerAnchor = document.getElementById("skin-picker-anchor");
  const skinPickerToggle = document.getElementById("skin-picker-toggle");
  const skinPickerPopover = document.getElementById("skin-picker-popover");
  const skinPickerLabel = document.getElementById("skin-picker-label");
  const skinPickerSearch = document.getElementById("skin-picker-search");
  const skinPickerList = document.getElementById("skin-picker-list");
  const skinPickerCount = document.getElementById("skin-picker-count");

  let currentTheme = localStorage.getItem("trk-theme") || "dark";
  let currentSkinId = "wizard-cli";

  // テーマを適用
  function applyTheme(theme) {
    if (theme === "system") {
      root.removeAttribute("data-theme");
      root.style.colorScheme = "light dark";
    } else {
      root.setAttribute("data-theme", theme);
      root.style.colorScheme = theme;
    }
    currentTheme = theme;
    localStorage.setItem("trk-theme", theme);
    themeSelect.value = theme;
    themeToggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    themeToggle.textContent = theme === "dark" ? "🌙" : "☀️";
  }

  // テーマ初期化
  applyTheme(currentTheme);

  // テーマ切替イベント
  themeSelect.addEventListener("change", (e) => applyTheme(e.target.value));
  themeToggle.addEventListener("click", () => {
    const next = currentTheme === "dark" ? "light" : "dark";
    applyTheme(next);
  });

  // --- スキン選択ポップオーバー ---
  const wizardSkins = SKINS_WIZARD.filter((s) => s.cat && s.cat.includes("wizard"));
  skinPickerCount.textContent = `${wizardSkins.length} 種`;

  // スキンリストをレンダリング
  function renderSkinList(filter = "") {
    skinPickerList.innerHTML = "";
    const filtered = wizardSkins.filter((s) =>
      s.id.toLowerCase().includes(filter.toLowerCase()) ||
      (s.label && s.label.ja && s.label.ja.includes(filter))
    );
    filtered.forEach((skin) => {
      const li = document.createElement("li");
      li.role = "menuitem";
      li.className = "skin-picker-item";
      li.dataset.skinId = skin.id;
      if (skin.id === currentSkinId) li.classList.add("current");
      li.innerHTML = `
        <span class="skin-picker-item-color" style="background:${skin.colors.accent};"></span>
        <span class="skin-picker-item-id">${skin.id}</span>
        <span class="skin-picker-item-label">${skin.label ? skin.label.ja : ""}</span>
      `;
      li.addEventListener("click", () => {
        applySkin(skin.id);
        skinPickerPopover.hidden = true;
        skinPickerToggle.setAttribute("aria-expanded", "false");
      });
      skinPickerList.appendChild(li);
    });
  }

  renderSkinList();

  // 検索フィルタ
  skinPickerSearch.addEventListener("input", (e) => renderSkinList(e.target.value));

  // ポップオーバー開閉
  skinPickerToggle.addEventListener("click", () => {
    const expanded = skinPickerToggle.getAttribute("aria-expanded") === "true";
    skinPickerPopover.hidden = expanded;
    skinPickerToggle.setAttribute("aria-expanded", String(!expanded));
    if (!expanded) skinPickerSearch.focus();
  });

  // ポップオーバー外クリックで閉じる
  document.addEventListener("click", (e) => {
    if (!skinPickerAnchor.contains(e.target)) {
      skinPickerPopover.hidden = true;
      skinPickerToggle.setAttribute("aria-expanded", "false");
    }
  });

  // --- スキン適用 ---
  function applySkin(id) {
    const skin = SKINS_WIZARD.find((s) => s.id === id);
    if (!skin) throw new Error("skin not found");
    currentSkinId = id;
    skinPickerLabel.textContent = id;

    root.style.setProperty("--skin-bg", skin.colors.bg);
    root.style.setProperty("--skin-panel", skin.colors.panel);
    root.style.setProperty("--skin-text", skin.colors.text);
    root.style.setProperty("--skin-muted", skin.colors.muted);
    root.style.setProperty("--skin-accent", skin.colors.accent);
    root.style.setProperty("--skin-gold", skin.colors.gold);
    root.style.setProperty("--skin-border", skin.colors.border);

    if (skin.cli) {
      const look = sanitizeCliLook(skin.cli);
      cliLookVars(look, root);
    }

    // 現在選択中のリスト項目を更新
    document.querySelectorAll(".skin-picker-item").forEach((li) => {
      li.classList.toggle("current", li.dataset.skinId === id);
    });
  }

  // --- スキンプレビューカードのレンダリング ---
  const skinPreviewGrid = document.getElementById("skin-preview-grid");
  const statusAnnouncer = document.getElementById("status-announcer");

  function announce(message) {
    statusAnnouncer.textContent = message;
  }

  function renderSkinPreview() {
    skinPreviewGrid.innerHTML = "";
    wizardSkins.forEach((skin) => {
      const card = document.createElement("article");
      card.className = "skin-preview-card";
      card.tabIndex = 0;
      card.dataset.skinId = skin.id;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `${skin.id} - ${skin.label ? skin.label.ja : ""} スキン`);
      if (skin.id === currentSkinId) card.classList.add("current");
      card.innerHTML = `
        <header class="skin-preview-card-header">
          <h3 class="skin-preview-card-id">${skin.id}</h3>
          <p class="skin-preview-card-label">${skin.label ? skin.label.ja : ""}</p>
        </header>
        <div class="skin-preview-card-body">
          <div class="skin-preview-card-color-swatch">
            <span class="skin-preview-color" style="background:${skin.colors.bg};" title="bg"></span>
            <span class="skin-preview-color" style="background:${skin.colors.panel};" title="panel"></span>
            <span class="skin-preview-color" style="background:${skin.colors.text};" title="text"></span>
            <span class="skin-preview-color" style="background:${skin.colors.accent};" title="accent"></span>
            <span class="skin-preview-color" style="background:${skin.colors.gold};" title="gold"></span>
          </div>
        </div>
        <footer class="skin-preview-card-footer">
          <button type="button" class="skin-preview-card-apply" data-skin-id="${skin.id}">適用</button>
        </footer>
      `;

      // カードクリックで適用
      card.addEventListener("click", (e) => {
        if (e.target.classList.contains("skin-preview-card-apply")) return;
        applySkin(skin.id);
        announce(`スキンを${skin.id}に変更しました`);
      });

      // 「適用」ボタンクリック
      const applyBtn = card.querySelector(".skin-preview-card-apply");
      applyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        applySkin(skin.id);
        announce(`スキンを${skin.id}に変更しました`);
      });

      // キーボードナビゲーション（Enter/Space で適用）
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          applySkin(skin.id);
          announce(`スキンを${skin.id}に変更しました`);
        }
      });

      skinPreviewGrid.appendChild(card);
    });
  }

  renderSkinPreview();

  // デフォルトスキンを適用
  applySkin("wizard-cli");

  // --- スキンピッカー キーボードナビゲーション ---
  let skinPickerFocusedIndex = -1;
  const skinPickerItems = () => skinPickerList.querySelectorAll('[role="menuitem"]');

  function updateSkinPickerFocus(index) {
    const items = skinPickerItems();
    items.forEach((item, i) => {
      item.tabIndex = i === index ? 0 : -1;
    });
    if (items[index]) items[index].focus();
  }

  skinPickerToggle.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      skinPickerPopover.hidden = false;
      skinPickerToggle.setAttribute("aria-expanded", "true");
      skinPickerFocusedIndex = 0;
      updateSkinPickerFocus(skinPickerFocusedIndex);
    }
  });

  skinPickerList.addEventListener("keydown", (e) => {
    const items = skinPickerItems();
    if (items.length === 0) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      skinPickerFocusedIndex = Math.min(skinPickerFocusedIndex + 1, items.length - 1);
      updateSkinPickerFocus(skinPickerFocusedIndex);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      skinPickerFocusedIndex = Math.max(skinPickerFocusedIndex - 1, 0);
      updateSkinPickerFocus(skinPickerFocusedIndex);
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (items[skinPickerFocusedIndex]) {
        const skinId = items[skinPickerFocusedIndex].dataset.skinId;
        applySkin(skinId);
        skinPickerPopover.hidden = true;
        skinPickerToggle.setAttribute("aria-expanded", "false");
        skinPickerToggle.focus();
        announce(`スキンを${skinId}に変更しました`);
      }
    } else if (e.key === "Escape") {
      skinPickerPopover.hidden = true;
      skinPickerToggle.setAttribute("aria-expanded", "false");
      skinPickerToggle.focus();
    }
  });

  // --- CLI 初期化 ---
  const term = document.getElementById("cli-term");
  const input = document.getElementById("cli-input");

  // --- CLI キーボードショートカット ---
  input.addEventListener("keydown", (e) => {
    // Esc で入力クリア
    if (e.key === "Escape") {
      input.value = "";
      announce("入力をクリアしました");
    }
    // Ctrl+L で画面クリア（clear コマンドと同じ）
    if (e.key === "l" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      cli.run("clear");
    }
  });

  const skinManager = {
    applySkin(id) {
      return applySkin(id);
    },
  };

  const cli = new CliCommands(skinManager);

  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const value = input.value.trim();
      input.value = "";
      const line = document.createElement("div");
      line.className = "cli-line";
      line.innerHTML = `<span class="cli-prompt">λ</span><span class="cli-caret cursor ${cli.history.entries.length % 2 === 0 ? "block" : ""}"></span> ${value}`;
      term.appendChild(line);
      const out = await cli.run(value);
      if (out === "__CLEAR__") {
        term.innerHTML = "";
      } else if (out) {
        const outLine = document.createElement("div");
        outLine.className = "cli-line cli-muted";
        outLine.textContent = out;
        term.appendChild(outLine);
      }
      term.scrollTop = term.scrollHeight;
    }
  });
</script>

</body>
</html>
