name: check

on:
  push:
  pull_request:
  schedule:
    # 相手側（trk-PWA）は日々変わります。こちらが触っていなくても、週に1回は契約を確かめます
    - cron: "0 21 * * 0"   # 日曜 21:00 UTC（月曜 06:00 JST）
  workflow_dispatch:

permissions:
  contents: read

env:
  # 相手側の版（commit）。上げるときは、この1行と HANDOFF §2.5・§7 の記録を一緒に変える
  # （trk240 = 7344111。アプリ側の受け入れ道具 tools/check-set.mjs に --json が入り、
  #   呼び方・終了コード・--json の項目・--have の形が「契約」として書面に固定された版）
  TRK_PWA_REF: 734411154b4e442676c78fbe42cb9bc3beab7b95

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: この倉庫
        uses: actions/checkout@v4
        with:
          path: trk-Avatar-Library

      # tools は trk-PWA の js/zip-io.js・js/pack-catalog.js を「そのまま」読みます（写しを持たない）
      - name: trk-PWA（相手側・バージョンを固定して取る）
        uses: actions/checkout@v4
        with:
          repository: TonbokiriRaikiriMuramasa-Taikoubou/trk-PWA
          ref: ${{ env.TRK_PWA_REF }}
          path: trk-PWA
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 書体の取り置きを使い回す（SOURCE.json が変わったら取り直す）
        uses: actions/cache@v4
        with:
          path: trk-Avatar-Library/.cache/font-packs
          key: fontsource-${{ hashFiles('trk-Avatar-Library/font-packs/*/SOURCE.json') }}

      - name: 道具の自己検査（selftest）
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: node tools/selftest.mjs

      - name: 目録が最新か
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: node tools/build-catalog.mjs --check

      - name: 目録がアプリ（固定した版）の読み取り規則を通るか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: node tools/check-contract.mjs

      - name: 書体（woff2）が本当に読める形か
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: node tools/check-fonts.mjs

      - name: 全スキン見本が今の中身と一致するか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: node tools/export-skin-gallery.mjs --trk="$TRK_PWA" --check

      - name: 書体の一覧と検索が目録と一致するか
        run: node trk-Avatar-Library/tools/export-font-gallery.mjs --check

      - name: 書体パック（15 個）がフォルダと一致するか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          for d in font-packs/*/; do
            node tools/build-pack.mjs "$d" --check --fetch || exit 1
          done

      # r6 からは 2 つ（first-set＝軽い／font-set＝書体は全部）。記録があるセットだけを検査する
      # （記録がまだ無い定義は「これから配るもの」なので、作らずに飛ばす）
      - name: セットが記録と一致するか（記録のあるセットだけ）
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          for def in sets/*.json; do
            rec=$(node -p "require('./$def').record || ''")
            if [ -f "$rec" ]; then
              echo "—— $def（記録: $rec）"
              node tools/build-set.mjs "$def" --check || exit 1
            else
              echo "ℹ $def はまだ記録がありません（配る前に --release で記録を作ります）"
            fi
          done

      # 記録と一致するだけでなく「アプリが開いて中身を入れられる形か」を、アプリと同じ手順で見る
      - name: セットがアプリ（trk239）の手順で開けるか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          for def in sets/*.json; do
            rec=$(node -p "require('./$def').record || ''")
            [ -f "$rec" ] || continue
            node tools/build-set.mjs "$def"
            # 記録に載っている名前（.zip と .stlib）だけを見る（dist/ に古い版が残っていても混ざらない）
            FILES=$(node -p "const r=require('./$rec'); (r.files_out && r.files_out.length ? r.files_out : [{name:r.file}]).map(x=>'dist/'+x.name).join(' ')")
            for f in $FILES; do
              node tools/verify-set.mjs "$f" --record="$rec" || exit 1
            done
          done

      # 倉庫の決めごと（上）に加えて、**アプリ自身の判定**でも見る（trk240 の tools/check-set.mjs）。
      # trk240 からは --json があるので、日本語の文ではなく数字で判定する（無い版でもそのまま動く）
      # 2 つそろって記録があるときは、**両方の順**で「これから入る分」を数えてもらう
      - name: セットがアプリ（trk240）の判定でも通るか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          if [ ! -f "$TRK_PWA/tools/check-set.mjs" ]; then
            echo "ℹ 相手側に tools/check-set.mjs がありません（trk239 より前）。この検査は飛ばします"
            exit 0
          fi
          first=""; font=""
          for def in sets/*.json; do
            rec=$(node -p "require('./$def').record || ''")
            [ -f "$rec" ] || continue
            name=$(node -p "require('./$rec').name || ''")
            target=$(node -p "const r=require('./$rec'); 'dist/'+(r.files_out && r.files_out.length ? r.files_out[0].name : r.file)")
            case "$name" in
              first-set) first="$target" ;;
              font-set) font="$target" ;;
            esac
            echo "—— $rec"
            node tools/check-set-app.mjs "$target"
          done
          # 2 つそろっているとき：両方の順で「これから入る分」を数えてもらう（trk240 の setPending）
          # （書体セットを先に入れた人が、あとからはじめてセットを選ぶ場合も見る）
          if [ -n "$first" ] && [ -n "$font" ]; then
            node tools/check-set-app.mjs "$font" --have="$first" --both
          fi

      # パックの一覧（gallery/packs.html）が目録とずれていないか（selftest でも同じことを見ています）
      - name: パックの一覧が目録と合っているか
        run: node trk-Avatar-Library/tools/export-pack-gallery.mjs --check

      - name: README の表・リンク・セットの記録
        run: node trk-Avatar-Library/tools/check-docs.mjs

  # 相手側の最新が、こちらの契約と合っているか（固定した版ではなく main）
  upstream-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: この倉庫
        uses: actions/checkout@v4
        with:
          path: trk-Avatar-Library

      - name: trk-PWA（main・固定しない）
        uses: actions/checkout@v4
        with:
          repository: TonbokiriRaikiriMuramasa-Taikoubou/trk-PWA
          ref: main
          path: trk-PWA
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 目録がアプリの最新 main でも読めるか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: node tools/check-contract.mjs
