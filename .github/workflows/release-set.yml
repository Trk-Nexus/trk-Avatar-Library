name: release-set

# はじめてセット（ZIP）を作って、Release に添付する（2026-11-01）
#
# なぜ CI でやるか：
#   セットは倉庫の中身から**決定的に**作れるので、手元で作った ZIP を配る代わりに
#   CI で作り直して添付します。release/first-set.json と一致しないものは添付しません
#   （＝配るファイルと記録がずれない）。

on:
  push:
    tags:
      - "first-set-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "添付先の Release のタグ（例: first-set-2026-11-01）"
        required: true
        default: "first-set-2026-11-01"

permissions:
  contents: write

env:
  # trk235（cd00408）。check.yml と同じ版にそろえる（セットの作りは版に依らないが、記録を1か所にする）
  TRK_PWA_REF: cd00408962059ef9f7ecd63ee517c21d040e523d

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: この倉庫
        uses: actions/checkout@v4
        with:
          path: trk-Avatar-Library

      - name: trk-PWA（相手側・バージョンを固定して取る）
        uses: actions/checkout@v4
        with:
          repository: TonbokiriRaikiriMuramasa-Taikoubou/trk-PWA
          ref: ${{ env.TRK_PWA_REF }}
          path: trk-PWA

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: セットを作り直して、記録と一致するか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          node tools/build-set.mjs sets/first-set.json
          node tools/build-set.mjs sets/first-set.json --check

      # 添付する前に、アプリ（trk235）が開いて中身を入れられる形かを見る
      - name: セットがアプリ（trk235）の手順で開けるか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          # 記録に載っている名前（.zip と .stlib）だけを見る（dist/ に古い版が残っていても混ざらない）
          FILES=$(node -p "const r=require('./release/first-set.json'); (r.files_out && r.files_out.length ? r.files_out : [{name:r.file}]).map(x=>'dist/'+x.name).join(' ')")
          for f in $FILES; do
            node tools/verify-set.mjs "$f" --record=release/first-set.json || exit 1
          done

      - name: Release に添付（無ければ作る）
        working-directory: trk-Avatar-Library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # r4 から .zip と .stlib の 2 つ（同じバイト列）を添付します。記録の files_out を見ます
          FILES=$(node -p "const r=require('./release/first-set.json'); (r.files_out && r.files_out.length ? r.files_out.map(x => 'dist/' + x.name) : ['dist/' + r.file]).join(' ')")
          TITLE=$(node -p "require('./release/first-set.json').title || 'trk! はじめてセット'")
          BYTES=$(node -p "require('./release/first-set.json').bytes")
          SHA=$(node -p "require('./release/first-set.json').sha256")
          NOTES="release/first-set-notes.md"
          for f in $FILES; do echo "添付するファイル: $f（$(stat -c %s "$f") B）"; sha256sum "$f"; done
          # 見出しに、記録の大きさと sha256 を足す（notes のファイルは倉庫のもの）
          { cat "$NOTES"; printf '\n---\n\n大きさ **%s B**・sha256 `%s`\n' "$BYTES" "$SHA"; } > /tmp/notes.md
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "既にある Release に添付します（作り直しません）"
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            echo "Release を作って添付します"
            gh release create "$TAG" $FILES --repo "$REPO" --verify-tag \
              --title "$TITLE" --notes-file /tmp/notes.md
          fi
          gh release view "$TAG" --repo "$REPO" --json tagName,assets,isDraft \
            --jq '"タグ: \(.tagName) / 下書き: \(.isDraft) / 添付: " + ([.assets[] | "\(.name) \(.size) B"] | join(", "))'
