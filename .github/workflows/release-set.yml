name: release-set

# セット（ZIP / .stlib）を作って、Release に添付する（2026-11-01）
#
# なぜ CI でやるか：
#   セットは倉庫の中身から**決定的に**作れるので、手元で作った ZIP を配る代わりに
#   CI で作り直して添付します。release/<name>.json と一致しないものは添付しません
#   （＝配るファイルと記録がずれない）。
#
# r6 からは 2 つに分かれます（タグの頭で、どの定義を使うか決まります）：
#   first-set-*  … sets/first-set.json（見本＋目録＋書体 3〜5 本）
#   font-set-*   … sets/font-set.json（見本＋目録＋書体は全部）
#   どちらも、記録の tag と押したタグが一致していないと止まります（取り違え防止）。

on:
  push:
    tags:
      - "first-set-*"
      - "font-set-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "添付先の Release のタグ（例: first-set-2026-11-01-r6 / font-set-2026-11-01-r6）"
        required: true
        default: "first-set-2026-11-01-r6"

permissions:
  contents: write

env:
  # trk240（7344111）。check.yml と同じ版にそろえる（セットの作りは版に依らないが、記録を1か所にする）
  TRK_PWA_REF: 734411154b4e442676c78fbe42cb9bc3beab7b95

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: この倉庫
        uses: actions/checkout@v4
        with:
          path: trk-Avatar-Library

      - name: trk-PWA（相手側・バージョンを固定して取る）
        uses: actions/checkout@v4
        with:
          repository: Trk-Nexus/trk-PWA
          ref: ${{ env.TRK_PWA_REF }}
          path: trk-PWA

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # タグの頭（first-set / font-set）で、使う定義と記録を決める。取り違えたまま添付しない
      - name: どのセットを添付するか決める
        working-directory: trk-Avatar-Library
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            font-set-*) DEF=sets/font-set.json ;;
            first-set-*) DEF=sets/first-set.json ;;
            *) echo "❌ タグ $TAG に対応するセットの定義がありません（first-set-* / font-set-* のどちらかです）"; exit 1 ;;
          esac
          REC=$(node -p "require('./$DEF').record || ''")
          if [ ! -f "$REC" ]; then
            echo "❌ $REC がありません。先に node tools/build-set.mjs $DEF --release で記録を作ってください"
            exit 1
          fi
          RECTAG=$(node -p "require('./$REC').tag || ''")
          if [ "$RECTAG" != "$TAG" ]; then
            echo "❌ タグ $TAG と、記録（$REC）のタグ $RECTAG が違います（取り違えを防ぐため止めます）"
            exit 1
          fi
          echo "セットの定義: $DEF / 記録: $REC"
          {
            echo "SET_DEF=$DEF"
            echo "SET_REC=$REC"
          } >> "$GITHUB_ENV"

      - name: セットを作り直して、記録と一致するか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          node tools/build-set.mjs "$SET_DEF"
          node tools/build-set.mjs "$SET_DEF" --check

      # 添付する前に、アプリ（trk240）が開いて中身を入れられる形かを見る
      - name: セットがアプリ（trk240）の手順で開けるか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          # 記録に載っている名前（.zip と .stlib）だけを見る（dist/ に古い版が残っていても混ざらない）
          FILES=$(node -p "const r=require('./$SET_REC'); (r.files_out && r.files_out.length ? r.files_out : [{name:r.file}]).map(x=>'dist/'+x.name).join(' ')")
          for f in $FILES; do
            node tools/verify-set.mjs "$f" --record="$SET_REC" || exit 1
          done

      # 倉庫の決めごと（上）に加えて、**アプリ自身の判定**でも通す（trk240 の tools/check-set.mjs をそのまま呼ぶ）。
      # もう 1 つのセットの記録があれば、その目録を「すでに入っている」として渡す（2 つ続けて入れる人の見え方）
      - name: セットがアプリ（trk240）の判定でも通るか
        working-directory: trk-Avatar-Library
        env:
          TRK_PWA: ${{ github.workspace }}/trk-PWA
        run: |
          if [ ! -f "$TRK_PWA/tools/check-set.mjs" ]; then
            echo "ℹ 相手側に tools/check-set.mjs がありません（trk239 より前）。この検査は飛ばします"
            exit 0
          fi
          TARGET=$(node -p "const r=require('./$SET_REC'); 'dist/'+(r.files_out && r.files_out.length ? r.files_out[0].name : r.file)")
          OTHER=""
          for def in sets/*.json; do
            if [ "$def" = "$SET_DEF" ]; then continue; fi
            rec=$(node -p "require('./$def').record || ''")
            if [ ! -f "$rec" ]; then continue; fi
            OTHER=$(node -p "const r=require('./$rec'); 'dist/'+(r.files_out && r.files_out.length ? r.files_out[0].name : r.file)")
          done
          if [ -n "$OTHER" ] && [ -f "$OTHER" ]; then
            node tools/check-set-app.mjs "$TARGET" --have="$OTHER"
          else
            node tools/check-set-app.mjs "$TARGET"
          fi

      - name: Release に添付（無ければ作る）
        working-directory: trk-Avatar-Library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # r4 から .zip と .stlib の 2 つ（同じバイト列）を添付します。記録の files_out を見ます
          FILES=$(node -p "const r=require('./$SET_REC'); (r.files_out && r.files_out.length ? r.files_out.map(x => 'dist/' + x.name) : ['dist/' + r.file]).join(' ')")
          TITLE=$(node -p "require('./$SET_REC').title || 'trk! のセット'")
          BYTES=$(node -p "require('./$SET_REC').bytes")
          SHA=$(node -p "require('./$SET_REC').sha256")
          NAME=$(node -p "require('./$SET_REC').name || 'first-set'")
          NOTES="release/${NAME}-notes.md"
          if [ ! -f "$NOTES" ]; then echo "❌ Release の説明書き $NOTES がありません"; exit 1; fi
          for f in $FILES; do echo "添付するファイル: $f（$(stat -c %s "$f") B）"; sha256sum "$f"; done
          # 見出しに、記録の大きさと sha256 を足す（notes のファイルは倉庫のもの）
          { cat "$NOTES"; printf '\n---\n\n大きさ **%s B**・sha256 `%s`\n' "$BYTES" "$SHA"; } > /tmp/notes.md
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "既にある Release に添付します（作り直しません）"
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            echo "Release を作って添付します"
            gh release create "$TAG" $FILES --repo "$REPO" --verify-tag \
              --title "$TITLE" --notes-file /tmp/notes.md
          fi
          gh release view "$TAG" --repo "$REPO" --json tagName,assets,isDraft \
            --jq '"タグ: \(.tagName) / 下書き: \(.isDraft) / 添付: " + ([.assets[] | "\(.name) \(.size) B"] | join(", "))'
